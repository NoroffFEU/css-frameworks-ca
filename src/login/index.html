<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/src/media/quiply-icon.png">

    <link rel="stylesheet" href="/src/styles.css">
    <title>Register</title>
</head>
<body class="flex-center flex-column">
    <div class="prog-bar flex-center">
        <div class="progress-point flex-center flex-column">
            <div class="progress-point-active"></div>
            <div class="text">Start</div>
        </div>
        <div class="progress-line progress-line-active"></div>
        <div class="progress-point flex-center flex-column">
            <div class="progress-point-inactive"></div>
            <div class="progress-point-text">Register user</div>
        </div>
        <div class="progress-line"></div>
        <div class="progress-point flex-center flex-column">
            <div class="progress-point-inactive"></div>
            <div class="progress-point-text">You're in!</div>
        </div>
    </div>
    <h1 class="register-title">Register</h1>
    <div class="container">
        <form class="register-form" action="/src/register/index.html" method="POST">
            <div class="mb-3">
                <div class="form-email">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="form-password">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
            <div class="error-message">
                <p class="error-message-text">Invalid email or password</p>
            </div>
            <div class="recovery">
                <p>Need help <a href=""><span>recover your password?</span></a></p>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>

    <script src="/node_modules/bootstrap/dist/js/bootstrap.js"></script>
</body>
</html>
