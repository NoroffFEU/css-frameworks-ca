<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/src/media/quiply-icon.png">

    <link rel="stylesheet" href="/styles.css">
    <title>Register</title>
</head>
<body>
    <main class="registration-content flex-center flex-column">
        <h1 class="register-title mt-4">Register</h1>
        <div class="container-fluid registration">
            <form class="register-form mx-auto mt-4" action="/src/profile/index.html">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" pattern="[a-zA-Z0-9.-_]{1,}@[a-zA-Z.-]{2,}[.]{1}[a-zA-Z]{2,}" required>
                    <label for="floatingInput">Email address</label>
                </div>
                <div class="form-floating mt-4">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Password" minlength="8" required>
                    <label for="floatingPassword">Password</label>
                    <img class="toggle-password-visibility" src="/src/media/icons/eye-closed.png" alt="Show password icon">
                </div>
                <div class="error mt-4">
                    <div class="error-message d-flex align-items-center gap-10">
                        <p class="error-message-text p-0 m-0 invalid-feedback">Oh no! That combination does not work together.</p>
                    </div>
                    <div class="error-message d-flex align-items-center gap-10">
                        <p class="error-message-text p-0 m-0">Need help <a href="">recover your password?</a></p>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-4">Register</button>
            </form>
        </div>
    </main>
    <script src="/node_modules/bootstrap/dist/js/bootstrap.js"></script>
</body>
</html>
